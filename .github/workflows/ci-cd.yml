# ============================================
# Data Stream Flow - CI/CD Pipeline
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Manual trigger

# ============================================
# Environment Variables
# ============================================
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  COMPOSE_PROJECT_NAME: datastreamflow

# ============================================
# Jobs
# ============================================
jobs:
  # ============================================
  # Lint and Code Quality
  # ============================================
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install flake8 black isort bandit

      - name: Run Flake8
        run: |
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Black formatting check
        run: |
          black --check src/ tests/

      - name: Run isort import order check
        run: |
          isort --check-only --diff src/ tests/

      - name: Run Bandit security scan
        run: |
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -f txt

  # ============================================
  # Security Scanning
  # ============================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Check for secrets with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified || true

      - name: Dependency safety check
        run: |
          pip install safety
          safety check --json > safety-report.json || true
          safety check

  # ============================================
  # Unit Tests
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests

  # ============================================
  # Build and Integration Tests
  # ============================================
  build-and-integration:
    name: Build & Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, security, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          cp .env.example .env
          echo "AIRFLOW_DB_PASSWORD=test_password" >> .env
          echo "MINIO_ROOT_USER=minioadmin" >> .env
          echo "MINIO_ROOT_PASSWORD=minioadmin" >> .env
          echo "MINIO_REGION_NAME=us-east-1" >> .env
          echo "AIRFLOW__SMTP__SMTP_HOST=smtp.gmail.com" >> .env
          echo "AIRFLOW__SMTP__SMTP_PORT=587" >> .env
          echo "AIRFLOW__SMTP__SMTP_USER=test@test.com" >> .env
          echo "AIRFLOW__SMTP__SMTP_PASSWORD=test" >> .env
          echo "AIRFLOW__SMTP__SMTP_MAIL_FROM=test@test.com" >> .env
          echo "AIRFLOW_SECRET_KEY=test_secret_key" >> .env
          echo "AIRFLOW_WEBSERVER_SECRET_KEY=test_web_secret_key" >> .env
          echo "AIRFLOW_API_PASSWORD=test_api_password" >> .env
          echo "GRAFANA_PASSWORD=test_grafana" >> .env
          echo "SMTP_HOST=smtp.gmail.com" >> .env
          echo "SMTP_USER=test@test.com" >> .env
          echo "SMTP_PASSWORD=test" >> .env
          echo "SMTP_FROM=test@test.com" >> .env
          echo "AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:test_password@postgres:5432/airflow" >> .env
          echo "AIRFLOW__CORE__EXECUTOR=LocalExecutor" >> .env
          echo "AIRFLOW__CORE__DAG_DIR_LIST_INTERVAL=30" >> .env
          echo "AIRFLOW__CORE__LOGGING_LEVEL=INFO" >> .env
          echo "AIRFLOW__CORE__DAG_CONCURRENCY=16" >> .env
          echo "AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG=3" >> .env
          echo "AIRFLOW__CORE__PARALLELISM=16" >> .env
          echo "KAFKA_BROKER_ID=1" >> .env
          echo "KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181" >> .env
          echo "KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092" >> .env
          echo "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT" >> .env
          echo "KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT" >> .env
          echo "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1" >> .env
          echo "KAFKA_LOG_RETENTION_HOURS=168" >> .env
          echo "KAFKA_LOG_SEGMENT_BYTES=1073741824" >> .env
          echo "ELASTICSEARCH_HOSTS=http://elasticsearch:9200" >> .env
          echo "ES_JAVA_OPTS=-Xms512m -Xmx512m" >> .env
          echo "APP_ENV=development" >> .env
          echo "LOG_LEVEL=INFO" >> .env
          echo "PIPELINE_SCHEDULE_INTERVAL=@hourly" >> .env
          echo "AIRFLOW_CPU_LIMIT=2" >> .env
          echo "AIRFLOW_MEMORY_LIMIT=2g" >> .env
          echo "KAFKA_MEMORY_LIMIT=2g" >> .env
          echo "MINIO_MEMORY_LIMIT=1g" >> .env
          echo "ELASTICSEARCH_MEMORY_LIMIT=1g" >> .env
          echo "NETWORK_SUBNET=172.28.0.0/16" >> .env

      - name: Build Docker images
        run: |
          docker compose build --no-cache

      - name: Start services
        run: |
          docker compose up -d
          
      - name: Wait for Kafka
        run: |
          echo "Waiting for Kafka..."
          for i in {1..30}; do
            if docker compose exec -T kafka kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1; then
              echo "Kafka is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 10
          done

      - name: Wait for Airflow
        run: |
          echo "Waiting for Airflow..."
          for i in {1..30}; do
            if docker compose exec -T airflow curl -f http://localhost:8080/health > /dev/null 2>&1; then
              echo "Airflow is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 10
          done

      - name: Create Kafka topic
        run: |
          docker compose exec -T kafka kafka-topics --create \
            --topic data_topic \
            --bootstrap-server localhost:9092 \
            --partitions 3 \
            --replication-factor 1 || true

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v

      - name: Copy DAGs and scripts to Airflow
        run: |
          docker compose cp src/dags/. airflow:/opt/airflow/dags/
          docker compose cp src/scripts/. airflow:/opt/airflow/scripts/

      - name: Verify DAG is loaded
        run: |
          docker compose exec -T airflow airflow dags list | grep data_pipeline_dag

      - name: Stop services
        if: always()
        run: |
          docker compose down --volumes --remove-orphans

  # ============================================
  # End-to-End Tests (Scheduled Only)
  # ============================================
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          cp .env.example .env
          echo "AIRFLOW_DB_PASSWORD=test_password" >> .env
          echo "MINIO_ROOT_USER=minioadmin" >> .env
          echo "MINIO_ROOT_PASSWORD=minioadmin" >> .env
          echo "MINIO_REGION_NAME=us-east-1" >> .env
          echo "AIRFLOW__SMTP__SMTP_HOST=smtp.gmail.com" >> .env
          echo "AIRFLOW__SMTP__SMTP_PORT=587" >> .env
          echo "AIRFLOW__SMTP__SMTP_USER=test@test.com" >> .env
          echo "AIRFLOW__SMTP__SMTP_PASSWORD=test" >> .env
          echo "AIRFLOW__SMTP__SMTP_MAIL_FROM=test@test.com" >> .env
          echo "AIRFLOW_SECRET_KEY=test_secret_key" >> .env
          echo "AIRFLOW_WEBSERVER_SECRET_KEY=test_web_secret_key" >> .env
          echo "AIRFLOW_API_PASSWORD=test_api_password" >> .env
          echo "GRAFANA_PASSWORD=test_grafana" >> .env
          echo "SMTP_HOST=smtp.gmail.com" >> .env
          echo "SMTP_USER=test@test.com" >> .env
          echo "SMTP_PASSWORD=test" >> .env
          echo "SMTP_FROM=test@test.com" >> .env
          echo "AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:test_password@postgres:5432/airflow" >> .env
          echo "AIRFLOW__CORE__EXECUTOR=LocalExecutor" >> .env
          echo "AIRFLOW__CORE__DAG_DIR_LIST_INTERVAL=30" >> .env
          echo "AIRFLOW__CORE__LOGGING_LEVEL=INFO" >> .env
          echo "AIRFLOW__CORE__DAG_CONCURRENCY=16" >> .env
          echo "AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG=3" >> .env
          echo "AIRFLOW__CORE__PARALLELISM=16" >> .env
          echo "KAFKA_BROKER_ID=1" >> .env
          echo "KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181" >> .env
          echo "KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092" >> .env
          echo "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT" >> .env
          echo "KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT" >> .env
          echo "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1" >> .env
          echo "KAFKA_LOG_RETENTION_HOURS=168" >> .env
          echo "KAFKA_LOG_SEGMENT_BYTES=1073741824" >> .env
          echo "ELASTICSEARCH_HOSTS=http://elasticsearch:9200" >> .env
          echo "ES_JAVA_OPTS=-Xms512m -Xmx512m" >> .env
          echo "APP_ENV=development" >> .env
          echo "LOG_LEVEL=INFO" >> .env
          echo "PIPELINE_SCHEDULE_INTERVAL=@hourly" >> .env
          echo "AIRFLOW_CPU_LIMIT=2" >> .env
          echo "AIRFLOW_MEMORY_LIMIT=2g" >> .env
          echo "KAFKA_MEMORY_LIMIT=2g" >> .env
          echo "MINIO_MEMORY_LIMIT=1g" >> .env
          echo "ELASTICSEARCH_MEMORY_LIMIT=1g" >> .env
          echo "NETWORK_SUBNET=172.28.0.0/16" >> .env

      - name: Start services
        run: |
          docker compose up -d
          
      - name: Wait for all services
        run: |
          # Wait for Kafka
          for i in {1..30}; do
            docker compose exec -T kafka kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1 && break
            sleep 10
          done
          
          # Wait for Airflow
          for i in {1..30}; do
            docker compose exec -T airflow curl -f http://localhost:8080/health > /dev/null 2>&1 && break
            sleep 10
          done
          
          # Wait for Elasticsearch
          for i in {1..20}; do
            curl -sf http://localhost:9200 > /dev/null && break
            sleep 10
          done

      - name: Copy DAGs and scripts
        run: |
          docker compose cp src/dags/. airflow:/opt/airflow/dags/
          docker compose cp src/scripts/. airflow:/opt/airflow/scripts/

      - name: Trigger DAG
        run: |
          docker compose exec -T airflow airflow dags trigger -r github-actions-run data_pipeline_dag

      - name: Wait for DAG completion
        run: |
          echo "Waiting for DAG to complete..."
          for i in {1..60}; do
            STATE=$(docker compose exec -T airflow airflow dags state data_pipeline_dag $(date +%Y-%m-%dT%H:%M:%S) 2>/dev/null | grep -oP 'success|failed|running' || echo "running")
            echo "Current state: $STATE"
            if [[ "$STATE" == "success" ]] || [[ "$STATE" == "failed" ]]; then
              break
            fi
            sleep 30
          done

      - name: Verify Elasticsearch data
        run: |
          sleep 10
          curl -s http://localhost:9200/_cat/indices?v

      - name: Stop services
        if: always()
        run: |
          docker compose down --volumes --remove-orphans

  # ============================================
  # Notify Slack
  # ============================================
  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [build-and-integration, e2e-tests]
    if: always()
    steps:
      - name: Send failure notification
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send success notification
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
