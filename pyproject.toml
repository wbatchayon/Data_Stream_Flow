# ============================================
# Data Stream Flow - Python Package Configuration
# ============================================
# This file configures the project for PyPI distribution
# Compatible with pip, poetry, and modern Python packaging

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datastreamflow"
version = "1.0.0"
description = "Enterprise-grade data pipeline with MLOps and DevSecOps best practices"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "William BATCHAYON", email = "batchayw@protonmail.com", github = "batchayw"}
]
keywords = ["data-pipeline", "mlops", "airflow", "spark", "kafka", "elasticsearch", "data-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Minimal dependencies for the core package
dependencies = [
    "apache-airflow>=2.8.0",
    "pandas>=2.0.0",
    "pyspark>=3.5.0",
    "kafka-python-ng>=2.2.0",
    "minio>=7.2.0",
    "elasticsearch>=8.0.0",
    "requests>=2.31.0",
    "flask>=3.0.0",
]

# Optional dependencies for extra features
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "bandit>=1.7.0",
    "safety>=3.0.0",
]
kafka = ["kafka-python-ng>=2.2.0"]
storage = ["minio>=7.2.0"]
search = ["elasticsearch>=8.0.0"]
api = ["flask>=3.0.0"]

# Entry points for CLI commands
[project.scripts]
datastreamflow = "src.scripts.api.api:main"

# URLs
[project.urls]
Homepage = "https://github.com/batchayw/Data_Stream_Flow"
Documentation = "https://github.com/batchayw/Data_Stream_Flow#readme"
Repository = "https://github.com/batchayw/Data_Stream_Flow"
Issues = "https://github.com/batchayw/Data_Stream_Flow/issues"
Discussions = "https://github.com/batchayw/Data_Stream_Flow/discussions"

# Package configuration
[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
exclude = ["tests*", "docs*", "img*", "monitoring*", "docker*", "infra*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.txt", "*.cfg", "*.ini"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "security: Security tests",
]

[tool.coverage.run]
source = ["src", "scripts"]
omit = ["*/tests/*", "*/test_*.py", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
